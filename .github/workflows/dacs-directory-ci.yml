name: dacs-directory CI

# Validates the DACS Directory reference implementation on every PR and on
# pushes to main. Scoped by path so unrelated repo changes don't trigger it.
on:
  push:
    branches: [main]
    paths:
      - "reference-implementations/dacs-directory/**"
      - ".github/workflows/dacs-directory-ci.yml"
  pull_request:
    paths:
      - "reference-implementations/dacs-directory/**"
      - ".github/workflows/dacs-directory-ci.yml"

# Cancel superseded runs for the same ref to save runner minutes.
concurrency:
  group: dacs-directory-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: reference-implementations/dacs-directory
    env:
      # Keeps canonical URLs / sitemap deterministic during the build instead
      # of falling back to localhost (which the build warns about). A reserved
      # RFC 6761 documentation name: only the flagged CI check below accepts it.
      NEXT_PUBLIC_DIRECTORY_URL: https://directory.ci.example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The exact Node release is pinned in .nvmrc.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: reference-implementations/dacs-directory/.nvmrc

      - name: Vendor + build the pinned dacs-sdk, install app deps
        # setup-sdk.sh clones DACS-Agent-commerce/dacs-sdk at its pinned commit.
        # The repo is public; DACS_SDK_GITHUB_TOKEN, when set, is only used to
        # authenticate that clone.
        env:
          DACS_SDK_GITHUB_TOKEN: ${{ secrets.DACS_SDK_GITHUB_TOKEN }}
        run: npm run setup

      - name: Typecheck
        run: npm run typecheck

      - name: Test (includes seed smoke)
        run: npm test

      # CI's origin is a documentation name, so this is the flagged check;
      # railway.json runs the strict production one.
      - name: Validate directory origin
        run: npm run check:deploy-config -- --allow-documentation-names

      - name: Production build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests
        run: npm run test:e2e
