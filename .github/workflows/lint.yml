name: lint

on:
  pull_request:
  push:
    branches: [main, phase0-completion]

permissions:
  contents: read

jobs:
  eslint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The exact Node release is pinned in .nvmrc.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: reference-implementations/dacs-directory/.nvmrc

      - name: Vendor + build the pinned dacs-sdk, install app deps
        env:
          DACS_SDK_GITHUB_TOKEN: ${{ secrets.DACS_SDK_GITHUB_TOKEN }}
        run: npm run setup --prefix reference-implementations/dacs-directory

      - name: Install the linter
        run: npm ci --prefix tools/lint --ignore-scripts

      - name: Lint
        run: npm run lint --prefix tools/lint
